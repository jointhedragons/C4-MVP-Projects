<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Schedule Planner - Simple Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">
                AI Schedule Planner
            </h1>
            <p class="text-lg text-gray-600">
                Find the perfect meeting time for your team with AI-powered scheduling
            </p>
        </div>

        <!-- Main Content -->
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                <!-- Availability Input -->
                <div class="mb-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-3">
                        Team Availability
                    </h2>
                    <textarea 
                        id="availability" 
                        class="w-full h-48 p-3 border border-gray-300 rounded-lg font-mono text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                        placeholder='{
  "Alice": [["09:00", "17:00"]],
  "Bob": [["12:00", "20:00"]],
  "Charlie": [["08:00", "12:00"], ["14:00", "18:00"]]
}'>{
  "Alice": [["09:00", "17:00"]],
  "Bob": [["12:00", "20:00"]],
  "Charlie": [["08:00", "12:00"], ["14:00", "18:00"]]
}</textarea>
                </div>

                <!-- Query Input -->
                <div class="mb-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-3">
                        Optional Query
                    </h2>
                    <input 
                        type="text" 
                        id="query" 
                        placeholder="e.g., 'morning meeting', 'urgent', 'flexible time'"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                    />
                </div>

                <!-- Find Meeting Time Button -->
                <div class="text-center">
                    <button 
                        id="findButton"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-lg transition-colors duration-200"
                    >
                        Find Meeting Time
                    </button>
                </div>
            </div>

            <!-- Results Display -->
            <div id="results" class="hidden">
                <!-- Results will be displayed here -->
            </div>

            <!-- Error Display -->
            <div id="error" class="hidden">
                <!-- Errors will be displayed here -->
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3001';
        
        document.getElementById('findButton').addEventListener('click', async () => {
            const availabilityText = document.getElementById('availability').value;
            const query = document.getElementById('query').value;
            const resultsDiv = document.getElementById('results');
            const errorDiv = document.getElementById('error');
            
            // Hide previous results
            resultsDiv.classList.add('hidden');
            errorDiv.classList.add('hidden');
            
            try {
                // Parse availability JSON
                const availability = JSON.parse(availabilityText);
                
                // Show loading state
                document.getElementById('findButton').textContent = 'Finding Meeting Times...';
                document.getElementById('findButton').disabled = true;
                
                // Make API call
                const response = await fetch(`${API_BASE_URL}/schedule`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        availability,
                        query: query.trim()
                    }),
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Display results
                displayResults(data);
                
            } catch (error) {
                // Display error
                errorDiv.innerHTML = `
                    <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                        <div class="flex">
                            <div class="flex-shrink-0">
                                <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                                </svg>
                            </div>
                            <div class="ml-3">
                                <h3 class="text-sm font-medium text-red-800">Error</h3>
                                <div class="mt-1 text-sm text-red-700">${error.message}</div>
                            </div>
                        </div>
                    </div>
                `;
                errorDiv.classList.remove('hidden');
            } finally {
                // Reset button
                document.getElementById('findButton').textContent = 'Find Meeting Time';
                document.getElementById('findButton').disabled = false;
            }
        });
        
        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            
            let html = `
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <div class="mb-4">
                        <h2 class="text-xl font-semibold text-gray-800 mb-2">
                            Meeting Time Results
                        </h2>
                        ${data.aiRefined ? '<div class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800 mb-3">✨ AI Enhanced</div>' : ''}
                    </div>
                    
                    <div class="mb-6 p-4 bg-gray-50 rounded-lg">
                        <h3 class="text-sm font-medium text-gray-700 mb-2">Explanation:</h3>
                        <p class="text-gray-600">${data.explanation}</p>
                    </div>
            `;
            
            if (data.slots && data.slots.length > 0) {
                html += `
                    <div class="mb-6">
                        <h3 class="text-lg font-medium text-gray-800 mb-3">
                            Available Time Slots (${data.slots.length})
                        </h3>
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Start Time</th>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">End Time</th>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Available Members</th>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200">
                `;
                
                data.slots.forEach(slot => {
                    html += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-3 text-sm font-medium text-gray-900">${slot.start}</td>
                            <td class="px-4 py-3 text-sm text-gray-900">${slot.end}</td>
                            <td class="px-4 py-3 text-sm text-gray-900">
                                <div class="flex flex-wrap gap-1">
                                    ${slot.members.map(member => `<span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800">${member}</span>`).join('')}
                                </div>
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-900">
                                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium ${slot.type === 'perfect' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                                    ${slot.type === 'perfect' ? 'Perfect' : 'Partial'}
                                </span>
                            </td>
                        </tr>
                    `;
                });
                
                html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="mb-6 p-4 bg-yellow-50 rounded-lg">
                        <h3 class="text-sm font-medium text-yellow-800 mb-2">No Available Slots</h3>
                        <p class="text-yellow-700">
                            No overlapping time slots found for the given team availability. 
                            Try adjusting the time ranges or adding more flexible schedules.
                        </p>
                    </div>
                `;
            }
            
            html += '</div>';
            resultsDiv.innerHTML = html;
            resultsDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
